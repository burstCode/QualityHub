# Стек QualityHub: PostgreSQL, Prometheus, Grafana, pgAdmin.
# Профили: demo (тестовая цель), load (генератор нагрузки k6).
#
#   docker compose up -d                       основной стек
#   docker compose --profile demo up -d        основной стек и тестовая цель
#   docker compose --profile load run --rm k6 run /scripts/endpoints/demo.js
name: qualityhub

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qualityhub}
      POSTGRES_USER: ${POSTGRES_USER:-qualityhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в deploy/.env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Задайте GRAFANA_DB_PASSWORD в deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипты выполняются один раз, при создании пустого тома, в алфавитном порядке
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:13.0.11
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Задайте GRAFANA_ADMIN_PASSWORD в deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/infra-server.json
      # Используются в provisioning/datasources
      QH_PG_DATABASE: ${POSTGRES_DB:-qualityhub}
      QH_PG_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"

  # Веб-интерфейс к PostgreSQL.
  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@qualityhub.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Задайте PGADMIN_PASSWORD в deploy/.env}
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmindata:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"

  # Профиль demo: тестовая цель, HTTP-сервер с настраиваемыми задержками и ошибками
  demo-target:
    profiles: ["demo"]
    image: mccutchen/go-httpbin:2.26.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  # Профиль load: генератор нагрузки, запускается разово командой run
  k6:
    profiles: ["load"]
    image: grafana/k6:2.3.0
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Вывод метрик в Prometheus
      K6_NO_USAGE_REPORT: "true"
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg,max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      # Параметры сценариев (perf/k6/lib/config.js)
      BASE_URL: ${K6_BASE_URL:-http://demo-target:8080}
      QH_PROJECT: ${QH_PROJECT:-demo}
      QH_ENV: ${QH_ENV:-local}
      QH_VERSION: ${QH_VERSION:-dev}
      QH_BUILD: ${QH_BUILD:-}
      QH_COMMIT: ${QH_COMMIT:-}
      K6_MODE: ${K6_MODE:-smoke}
      K6_TIME_SCALE: ${K6_TIME_SCALE:-1}
      K6_RATE: ${K6_RATE:-20}
      CLINICWEB_LOGIN: ${CLINICWEB_LOGIN:-}
      CLINICWEB_PASSWORD: ${CLINICWEB_PASSWORD:-}
    volumes:
      - ../perf/k6:/scripts:ro
      - ../perf/results:/results

volumes:
  pgdata:
  promdata:
  grafanadata:
  pgadmindata:

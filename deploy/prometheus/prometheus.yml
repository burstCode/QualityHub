global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # dev-сервер: windows_exporter, порт 9182 (железо, IIS, SQL Server)
  - job_name: windows
    scrape_interval: 15s
    static_configs:
      - targets: ["192.168.53.214:9182"]
        labels:
          env: dev
          role: web-server

  # ClinicWeb: метрики приложения (prometheus-net, путь /metrics).
  # Адреса задаются в targets/clinicweb.yml и подхватываются без перезапуска.
  - job_name: clinicweb
    file_sd_configs:
      - files: ["/etc/prometheus/targets/clinicweb.yml"]
        refresh_interval: 30s
    metric_relabel_configs:
      # Служебные счётчики QUIC (msquic) из .NET не нужны и только раздувают хранилище
      - source_labels: [__name__]
        regex: private_internaldiagnostics_.*
        action: drop
